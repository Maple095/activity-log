name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # 1. 建置任務：打包產物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Package Artifact
        run: |
          zip -r build.zip . -x ".git/*" ".github/*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  # 2. 單元測試階段 (Grade E - Test 1)
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests
        run: |
          npm run test:unit

  # 3. 整合測試階段 (Grade E - Test 2)
  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run Integration Tests
        run: |
          npm run test:integration

  # 4. 部署到 Staging 環境（依賴 test-integration）
  deploy-staging:
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifact..."
            gh release upload "$TAG" build.zip --clobber
          else
            gh release create "$TAG" build.zip --title "Staging Release ($TAG)" --notes "$NOTE"
          fi

  # 5. 部署到 Production 環境（受審查規則保護）
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifact..."
            gh release upload "$TAG" build.zip --clobber
          else
            gh release create "$TAG" build.zip --title "Production Release ($TAG)" --notes "$NOTE"
          fi
