name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. 建置任務：打包產物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Package Artifact
        run: |
          # 將專案內容壓縮打包成 build.zip（排除 .git 與 .github 目錄）
          zip -r build.zip . -x ".git/*" ".github/*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  # 2. 部署到 Staging 環境
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          # 檢查標籤是否已存在，不存在則建立 Release，已存在則上傳更新檔案
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifact..."
            gh release upload "$TAG" build.zip --clobber
          else
            gh release create "$TAG" build.zip --title "Staging Release ($TAG)" --notes "$NOTE"
          fi

  # 3. 部署到 Production 環境（受審查規則保護）
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifact..."
            gh release upload "$TAG" build.zip --clobber
          else
            gh release create "$TAG" build.zip --title "Production Release ($TAG)" --notes "$NOTE"
          fi
